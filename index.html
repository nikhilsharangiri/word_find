<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Meaning Finder</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #5b4636;
    --accent-light: #8a7361;
    --border: #e2ddd3;
    --success: #3f7a4e;
    --error: #b0413e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Georgia', 'Segoe UI', serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    color: var(--accent);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
    position: relative;
  }
  .input-wrap { flex: 1; position: relative; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: inherit;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent-light); }

  .suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .suggestions.visible { display: block; }
  .suggestion-item {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover,
  .suggestion-item.active {
    background: var(--bg);
    color: var(--accent);
  }
  .search-spacer { margin-bottom: 20px; }
  button {
    padding: 12px 20px;
    font-size: 0.95rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.secondary:hover { background: var(--border); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 20px;
    display: none;
  }
  .card.visible { display: block; }
  .word-title {
    font-size: 1.6rem;
    color: var(--accent);
    margin: 0 0 2px 0;
  }
  .phonetic {
    color: var(--muted);
    font-style: italic;
    margin-bottom: 14px;
  }
  .meaning-block { margin-bottom: 14px; }
  .pos {
    display: inline-block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--border);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .definition { margin: 4px 0; line-height: 1.5; }
  .definition::before { content: "• "; color: var(--accent-light); }
  .example {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    margin-left: 16px;
  }
  .status {
    text-align: center;
    margin: 12px 0;
    font-size: 0.9rem;
    min-height: 20px;
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }
  .status.loading { color: var(--muted); }

  .actions { display: flex; gap: 10px; margin-top: 10px; }

  .history {
    margin-top: 28px;
  }
  .history h2 {
    font-size: 1rem;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .history-item .h-word { font-weight: bold; color: var(--accent); }
  .history-item .h-meaning { color: var(--muted); flex: 1; margin-left: 12px; text-align: right; }

  .setup-note {
    background: #fff8e6;
    border: 1px solid #e8d9a8;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    color: #6b5a1e;
    margin-bottom: 20px;
    display: none;
  }
  .setup-note.visible { display: block; }
  .setup-note code {
    background: #f0e6c8;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Word Meaning Finder</h1>
  <div class="subtitle">Look up a word, then save it to your Google Sheet</div>

  <div class="setup-note" id="setupNote">
    <strong>One-time setup needed:</strong> paste your Google Apps Script Web App URL into the
    <code>SHEET_URL</code> constant near the top of the script in this file. See instructions at the bottom of this message.
  </div>

  <div class="search-row">
    <div class="input-wrap">
      <input type="text" id="wordInput" placeholder="Type a word..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button id="lookupBtn">Look up</button>
  </div>
  <div class="search-spacer"></div>

  <div class="status" id="status"></div>

  <div class="card" id="resultCard">
    <div class="word-title" id="resWord"></div>
    <div class="phonetic" id="resPhonetic"></div>
    <div id="resMeanings"></div>
    <div class="actions">
      <button id="saveBtn">Save to Google Sheet</button>
    </div>
  </div>

  <div class="history" id="historySection" style="display:none;">
    <h2>Saved this session</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
// ====== SETUP: paste your Google Apps Script Web App URL here ======
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyWBvKUo0ET3Sjosqb9nE3ZPA-VqThnW26Mw-f4nvZWfygYBcY8s6w6n2btDGoe__C0gQ/exec";
// =====================================================================

const wordInput = document.getElementById('wordInput');
const lookupBtn = document.getElementById('lookupBtn');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const resWord = document.getElementById('resWord');
const resPhonetic = document.getElementById('resPhonetic');
const resMeanings = document.getElementById('resMeanings');
const historySection = document.getElementById('historySection');
const historyList = document.getElementById('historyList');
const setupNote = document.getElementById('setupNote');
const suggestionsBox = document.getElementById('suggestions');

let currentEntry = null;
let suggestDebounce = null;
let activeSuggestionIndex = -1;
let currentSuggestions = [];

async function fetchSuggestions(prefix) {
  try {
    // Datamuse "sp" (spelled like) gives fast prefix-style word suggestions, no API key needed
    const res = await fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(prefix) + '*&max=8');
    if (!res.ok) return [];
    const data = await res.json();
    return data.map(d => d.word);
  } catch (err) {
    return [];
  }
}

function renderSuggestions(words) {
  currentSuggestions = words;
  activeSuggestionIndex = -1;
  suggestionsBox.innerHTML = '';
  if (!words.length) {
    suggestionsBox.classList.remove('visible');
    return;
  }
  words.forEach((w, i) => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.textContent = w;
    item.addEventListener('mousedown', (e) => {
      e.preventDefault(); // prevent input blur before click registers
      selectSuggestion(w);
    });
    suggestionsBox.appendChild(item);
  });
  suggestionsBox.classList.add('visible');
}

function selectSuggestion(word) {
  wordInput.value = word;
  suggestionsBox.classList.remove('visible');
  suggestionsBox.innerHTML = '';
  lookupWord();
}

function hideSuggestions() {
  suggestionsBox.classList.remove('visible');
}

function updateActiveSuggestion() {
  const items = suggestionsBox.querySelectorAll('.suggestion-item');
  items.forEach((el, i) => {
    el.classList.toggle('active', i === activeSuggestionIndex);
  });
  if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
    items[activeSuggestionIndex].scrollIntoView({ block: 'nearest' });
  }
}

wordInput.addEventListener('input', () => {
  const val = wordInput.value.trim();
  clearTimeout(suggestDebounce);
  if (val.length < 2) {
    hideSuggestions();
    return;
  }
  suggestDebounce = setTimeout(async () => {
    const words = await fetchSuggestions(val);
    // Only render if input hasn't changed since the request went out
    if (wordInput.value.trim() === val) {
      renderSuggestions(words);
    }
  }, 250);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.input-wrap')) hideSuggestions();
});

if (!SHEET_URL || SHEET_URL.includes('PASTE_YOUR')) {
  setupNote.classList.add('visible');
}

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

function getFallbackCandidates(word) {
  const w = word.toLowerCase();
  const candidates = [];

  // -ly adverb -> adjective (clumsily -> clumsy, quickly -> quick, happily -> happy)
  if (w.endsWith('ily') && w.length > 4) candidates.push(w.slice(0, -3) + 'y');
  if (w.endsWith('ly') && w.length > 3) candidates.push(w.slice(0, -2));

  // -ied -> -y (tried -> try), -ies -> -y (tries -> try)
  if (w.endsWith('ied') && w.length > 4) candidates.push(w.slice(0, -3) + 'y');
  if (w.endsWith('ies') && w.length > 4) candidates.push(w.slice(0, -3) + 'y');

  // -ing (running -> run / running -> runn -> also try dropping double consonant)
  if (w.endsWith('ing') && w.length > 5) {
    const base = w.slice(0, -3);
    candidates.push(base);
    if (base.length > 2 && base[base.length - 1] === base[base.length - 2]) {
      candidates.push(base.slice(0, -1)); // running -> run
    } else {
      candidates.push(base + 'e'); // making -> make
    }
  }

  // -ed (walked -> walk, tried already covered, stopped -> stop)
  if (w.endsWith('ed') && w.length > 4) {
    const base = w.slice(0, -2);
    candidates.push(base);
    if (base.length > 2 && base[base.length - 1] === base[base.length - 2]) {
      candidates.push(base.slice(0, -1));
    } else {
      candidates.push(base + 'e');
    }
  }

  // plural -es / -s (boxes -> box, cats -> cat)
  if (w.endsWith('es') && w.length > 4) candidates.push(w.slice(0, -2));
  if (w.endsWith('s') && w.length > 3) candidates.push(w.slice(0, -1));

  // de-duplicate, keep order
  return [...new Set(candidates)];
}

async function fetchDefinition(word) {
  const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
  if (!res.ok) return null;
  return res.json();
}

async function lookupWord() {
  const rawWord = wordInput.value.trim();
  if (!rawWord) {
    setStatus('Type a word first.', 'error');
    return;
  }
  setStatus('Looking up "' + rawWord + '"...', 'loading');
  resultCard.classList.remove('visible');
  lookupBtn.disabled = true;

  try {
    let data = await fetchDefinition(rawWord);
    let resolvedWord = rawWord;
    let usedFallback = false;

    if (!data) {
      // Try common root-word fallbacks (e.g. "clumsily" -> "clumsy")
      const candidates = getFallbackCandidates(rawWord);
      for (const candidate of candidates) {
        const candidateData = await fetchDefinition(candidate);
        if (candidateData) {
          data = candidateData;
          resolvedWord = candidate;
          usedFallback = true;
          break;
        }
      }
    }

    if (!data) throw new Error('not found');

    const entry = data[0];

    const phonetic = entry.phonetic ||
      (entry.phonetics && entry.phonetics.find(p => p.text) || {}).text || '';

    // Flatten meanings into a simple structure for display + saving
    const meaningsFlat = [];
    resMeanings.innerHTML = '';
    entry.meanings.forEach(m => {
      const posDiv = document.createElement('div');
      posDiv.className = 'meaning-block';
      const posLabel = document.createElement('div');
      posLabel.className = 'pos';
      posLabel.textContent = m.partOfSpeech;
      posDiv.appendChild(posLabel);

      m.definitions.slice(0, 3).forEach(d => {
        const defDiv = document.createElement('div');
        defDiv.className = 'definition';
        defDiv.textContent = d.definition;
        posDiv.appendChild(defDiv);
        meaningsFlat.push(m.partOfSpeech + ': ' + d.definition);

        if (d.example) {
          const exDiv = document.createElement('div');
          exDiv.className = 'example';
          exDiv.textContent = '"' + d.example + '"';
          posDiv.appendChild(exDiv);
        }
      });
      resMeanings.appendChild(posDiv);
    });

    currentEntry = {
      word: entry.word,
      phonetic: phonetic,
      meaning: meaningsFlat.join(' | ')
    };

    resWord.textContent = entry.word;
    resPhonetic.textContent = phonetic;
    resultCard.classList.add('visible');
    if (usedFallback) {
      setStatus('No entry for "' + rawWord + '" — showing root word "' + resolvedWord + '" instead.', 'success');
    } else {
      setStatus('', '');
    }
  } catch (err) {
    setStatus('Could not find a meaning for "' + rawWord + '". Check the spelling and try again.', 'error');
    currentEntry = null;
  } finally {
    lookupBtn.disabled = false;
  }
}

async function saveEntry() {
  if (!currentEntry) return;
  if (!SHEET_URL || SHEET_URL.includes('PASTE_YOUR')) {
    setStatus('Add your Google Apps Script URL in the code first (see note above).', 'error');
    return;
  }
  saveBtn.disabled = true;
  setStatus('Saving...', 'loading');
  try {
    // Using POST with an "action" field avoids CORS preflight issues with Apps Script
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script web apps don't return CORS headers; no-cors lets the write go through
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'addWord',
        word: currentEntry.word,
        meaning: currentEntry.meaning
      })
    });

    setStatus('Saved "' + currentEntry.word + '" to your sheet.', 'success');
    addToHistory(currentEntry);
  } catch (err) {
    setStatus('Save failed. Check your Apps Script URL and internet connection.', 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

function addToHistory(entry) {
  historySection.style.display = 'block';
  const row = document.createElement('div');
  row.className = 'history-item';
  const w = document.createElement('span');
  w.className = 'h-word';
  w.textContent = entry.word;
  const m = document.createElement('span');
  m.className = 'h-meaning';
  m.textContent = entry.meaning.split(' | ')[0];
  row.appendChild(w);
  row.appendChild(m);
  historyList.prepend(row);
}

lookupBtn.addEventListener('click', () => { hideSuggestions(); lookupWord(); });
saveBtn.addEventListener('click', saveEntry);
wordInput.addEventListener('keydown', e => {
  const isOpen = suggestionsBox.classList.contains('visible');

  if (isOpen && e.key === 'ArrowDown') {
    e.preventDefault();
    activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, currentSuggestions.length - 1);
    updateActiveSuggestion();
  } else if (isOpen && e.key === 'ArrowUp') {
    e.preventDefault();
    activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, -1);
    updateActiveSuggestion();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (isOpen && activeSuggestionIndex >= 0) {
      selectSuggestion(currentSuggestions[activeSuggestionIndex]);
    } else {
      hideSuggestions();
      lookupWord();
    }
  } else if (e.key === 'Escape') {
    hideSuggestions();
  }
});
</script>
</body>
</html>
